name: thai_hotline_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.1
  font_awesome_flutter: ^10.12.0
  carousel_slider: ^5.1.2
  dots_indicator: ^4.0.1
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  icons_launcher: ^3.0.3


flutter:
  uses-material-design: true
  assets:
    - assets/images/

icon_launcher:
  image_path: "assets/icon/cake.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

